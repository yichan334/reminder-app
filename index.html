<!DOCTYPE html><html lang="t<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>เตือนความจำ</title><style>body{font-family:sans-serif;background:#FFF7ED;margin:0;padding:16px}h1{color:#EA580C}input{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #ddd;box-sizing:border-box}button{width:100%;padding:14px;background:#F97316;color:#fff;border:0;border-radius:12px;font-size:18px}.card{background:#fff;padding:12px;border-radius:12px;margin:10px 0;display:flex;justify-content:space-between;align-items:center}.done{opacity:.5;text-decoration:line-through}</style></head><body><h1>🔔 เตือนความจำของฉัน</h1><input id="t" placeholder="พิมพ์สิ่งที่ต้องเตือน เช่น กินยา"><input id="d" type="datetime-local"><button onclick="add()">+ เพิ่มการเตือน</button><div id="list"></div><script>let a=JSON.parse(localStorage.getItem('r')||'[]');function render(){list.innerHTML=a.map((x,i)=>`<div class="card ${x.done?'done':''}"><div><b>${x.t}</b><br><small>${new Date(x.d).toLocaleString('th-TH')}</small></div><div><button style="width:auto;padding:8px" onclick="ok(${i})">✔️</button> <button style="width:auto;padding:8px;background:#EF4444" onclick="del(${i})">ลบ</button></div></div>`).join('')||'<p>ยังไม่มีการเตือน</p>';}function add(){if(!t.value)return alert('ใส่ชื่อก่อน');a.push({t:t.value,d:d.value||new Date(),done:false});localStorage.setItem('r',JSON.stringify(a));t.value='';render();}function ok(i){a[i].done=!a[i].done;localStorage.setItem('r',JSON.stringify(a));render();}function del(i){a.splice(i,1);localStorage.setItem('r',JSON.stringify(a));render();}setInterval(()=>{a.forEach(x=>{if(!x.done&&!x.noti&&new Date(x.d)<=new Date()){x.noti=1;alert('ถึงเวลาแล้ว: '+x.t);}})},10000);render();</script></body></html>
